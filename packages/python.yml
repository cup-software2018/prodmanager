# Building and running Python.
group: "python"
description: "Python build and runtime dependencies"
products: ["PYTHON"]
repos: []
packages:
  - "zlib-devel"
  - "bzip2"
  - "bzip2-devel"
  - "readline-devel"
  - "sqlite"
  - "sqlite-devel"
  - "openssl-devel"
  - "xz"
  - "xz-devel"
  - "libffi-devel"
  - "findutils"
  - "tk-devel"
  - "libnsl2-devel"
  - "xcb-util-cursor"
  - "gdbm-devel"
  # Runtime libraries of packages in PYTHON: pyodbc (and the Qt ODBC driver) need unixODBC, QtNfc needs pcsc-lite.
  - "unixODBC"
  - "pcsc-lite-libs"
optional: []
