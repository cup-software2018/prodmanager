product: "HDF5"
version: "V1.14.2"
source:
  url: "https://github.com/HDFGroup/hdf5/releases/download/hdf5-1_14_2/hdf5-1_14_2.tar.gz"
options:
  # C, C++ and high-level libraries, shared and static, tools, deflate (system zlib), no szip, no Fortran/Java/parallel,
  # not thread-safe, deprecated symbols kept. The library's own tests are built and run by build.sh; examples are not.
  # (1.14 calls the zlib option HDF5_ENABLE_Z_LIB_SUPPORT; 2.x calls it HDF5_ENABLE_ZLIB_SUPPORT.)
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_INSTALL_LIBDIR=lib"
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DBUILD_STATIC_LIBS=ON"
  - "-DBUILD_TESTING=ON"
  - "-DHDF5_BUILD_EXAMPLES=OFF"
  - "-DHDF5_BUILD_CPP_LIB=ON"
  - "-DHDF5_BUILD_HL_LIB=ON"
  - "-DHDF5_BUILD_TOOLS=ON"
  - "-DHDF5_BUILD_FORTRAN=OFF"
  - "-DHDF5_BUILD_JAVA=OFF"
  - "-DHDF5_ENABLE_PARALLEL=OFF"
  - "-DHDF5_ENABLE_THREADSAFE=OFF"
  - "-DHDF5_ENABLE_Z_LIB_SUPPORT=ON"
  - "-DZLIB_USE_EXTERNAL=OFF"
  - "-DHDF5_ENABLE_SZIP_SUPPORT=OFF"
  - "-DHDF5_ENABLE_DEPRECATED_SYMBOLS=ON"
