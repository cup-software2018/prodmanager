format: "1"
product: "CUPDATAMODEL"
version: "V1.3"
# depends: links ROOT (RawObjs, the dictionaries) and HDF5 (HDF5Utils); its CMake package config finds both
depends:
  - {name: "ROOT", version: "V6.40.04_3.14.9"}
  - {name: "HDF5", version: "V2.2.0"}
source:
  url: "https://github.com/cup-software2018/CUPDataModel.git"
  branch: "v1.3"
  commit: "93fcf9c8493843af3f1b5572bc3151b16a7f33cb"   # build.sh checks out exactly this commit
build: |
  recipes/CUPDATAMODEL/build.sh 1.3
    git clone <url>; git checkout <commit>
    cmake -DCMAKE_INSTALL_PREFIX=/home/cupsoft/Products/CUPDATAMODEL/V1.3 $(options in recipes/CUPDATAMODEL/V1.3.options)
    cmake --build; cmake --install
notes: "Same data model code as V1.1 (only its CMake changed), built against ROOT 6.40 and HDF5 2.2. The upstream test programs are not built (the source has them switched off); recipes/CUPDATAMODEL/check covers them. Built on cupdev1 (AlmaLinux 9.9, gcc 11.5) at the final path and copied to the server with rsync -a."
