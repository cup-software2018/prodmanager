format: "1"
product: "CUPDAQ"
version: "V4.3.1"
# depends: the programs and libraries link ROOT, HDF5 (libhdf5) and CUPDATAMODEL (RawObjs, HDF5Utils)
depends:
  - {name: "ROOT", version: "V6.40.04_3.14.9"}
  - {name: "HDF5", version: "V2.2.0"}
  - {name: "CUPDATAMODEL", version: "V1.3"}
source:
  url: "https://github.com/cup-software2018/CUPDAQ.git"
  branch: "v4.3"
  commit: "28ca0dc0d236af3f69cffae356a73f0182102a0f"   # build.sh checks out exactly this commit
build: |
  recipes/CUPDAQ/build.sh 4.3.1
    git clone <url>; git checkout <commit>
    cmake -DCMAKE_INSTALL_PREFIX=/home/cupsoft/Products/CUPDAQ/V4.3.1 $(options in recipes/CUPDAQ/V4.3.1.options)
    cmake --build; cmake --install; RPATH entries under /scratch/cupsoft/Products removed
notes: "The code of V4.3 (branch v4.3), rebuilt against ROOT 6.40, HDF5 2.2 and CUPDATAMODEL V1.3. System libraries: libusb, yaml-cpp, zeromq (packages group daq). Built on cupdev1 (AlmaLinux 9.9, gcc 11.5) at the final path and copied to the server with rsync -a."
