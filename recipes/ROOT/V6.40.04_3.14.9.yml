format: "1"
product: "ROOT"
version: "V6.40.04_3.14.9"
depends:
  - {name: "PYTHON", version: "V3.14.9"}
source:
  url: "https://root.cern/download/root_v6.40.04.source.tar.gz"
build: |
  recipes/ROOT/build.sh 6.40.04 3.14.9
    cmake -DCMAKE_INSTALL_PREFIX=/home/cupsoft/Products/ROOT/V6.40.04_3.14.9
          -DPython3_EXECUTABLE=/home/cupsoft/Products/PYTHON/V3.14.9/bin/python3
          $(options in recipes/ROOT/V6.40.04_3.14.9.options)
    cmake --build; cmake --install
notes: "Features as V6.32.20_3.11.14 plus mathmore, fftw3 and curl (HTTP I/O), without davix and mysql (removed in 6.40). Built on cupdev1 (AlmaLinux 9.9, gcc 11.5) at the final path and copied to the server with rsync -a."
