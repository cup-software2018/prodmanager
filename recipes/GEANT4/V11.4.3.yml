format: "1"
product: "GEANT4"
version: "V11.4.3"
source:
  url: "https://gitlab.cern.ch/geant4/geant4/-/archive/v11.4.3/geant4-v11.4.3.tar.gz"
build: |
  recipes/GEANT4/build.sh 11.4.3
    cmake -DCMAKE_INSTALL_PREFIX=/home/cupsoft/Products/GEANT4/V11.4.3 $(options in recipes/GEANT4/V11.4.3.options)
    cmake --build; cmake --install   (GEANT4_INSTALL_DATA downloads the data sets into share/Geant4/data)
notes: "Features as V11.1.3 (multithreaded, GDML, Qt5, OpenGL X11, builtin CLHEP/zlib/PTL, data in the prefix) except Qt3D, which Geant4 11.4 removed. Built on cupdev1 (AlmaLinux 9.9, gcc 11.5) at the final path and copied to the server with rsync -a."
