format: "1"
product: "HDF5"
version: "V2.2.0"
source:
  url: "https://github.com/HDFGroup/hdf5/releases/download/2.2.0/hdf5-2.2.0.tar.gz"
build: |
  recipes/HDF5/build.sh 2.2.0
    cmake -DCMAKE_INSTALL_PREFIX=/home/cupsoft/Products/HDF5/V2.2.0 $(options in recipes/HDF5/V2.2.0.options)
    cmake --build; ctest; cmake --install
notes: "Features as V1.14.2 (C, C++ and high-level libraries, shared and static, tools, deflate with system zlib, deprecated symbols) with the 2.x defaults: API mapping v200, files in the 1.8 format by default. Libraries in lib/ as in V1.14.2. Built on cupdev1 (AlmaLinux 9.9, gcc 11.5) at the final path and copied to the server with rsync -a."
